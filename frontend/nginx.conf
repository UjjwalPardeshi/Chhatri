# Chhatri console: nginx server template (SPEC §19.1, §20, §21, §23).
#
# Installed as /etc/nginx/templates/default.conf.template; the nginx image renders
# ${CHHATRI_BACKEND_UPSTREAM} (host:port of the backend) into conf.d/default.conf at start.
# - SPA: every unknown path falls back to index.html (/claims, /merchant/S-0142, ...).
# - /api/: proxied to the backend over HTTP/1.1 with buffering off and a 1 h read timeout, so the SSE
#   stream (/api/stream, keep-alive ping every 15 s) is flushed event by event and never cut.
# - gzip never applies to text/event-stream (not in gzip_types; explicitly off for /api/stream).
# - /internal/ is NOT proxied: n8n reaches the backend directly on the compose network.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # SPEC §19: image/audio uploads up to 5 MB, plus multipart overhead.
    client_max_body_size 6m;

    # Docker's DNS; resolving per request survives backend restarts (new container IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chhatri_backend http://${CHHATRI_BACKEND_UPSTREAM};

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events (SPEC §19.1): long-lived, unbuffered, uncompressed.
    location = /api/stream {
        proxy_pass $chhatri_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location /api/ {
        proxy_pass $chhatri_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # WhatsApp Cloud API webhook (SPEC §14.2) when the console host is the public entry point.
    location /webhooks/ {
        proxy_pass $chhatri_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite's hashed bundles never change; fonts and sample slips change rarely.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
