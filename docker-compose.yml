# Chhatri — Docker Compose orchestration (SPEC §23)
# Services: backend (FastAPI), frontend (nginx), n8n (workflows), paytm-mcp (optional)
# Usage:
#   make up           # start all services (backend, frontend, in-process n8n by default)
#   make down         # stop all services
#   docker compose --profile n8n up  # enable live n8n
#   docker compose config  # validate

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # From .env / docker-compose overrides
      CHHATRI_SEED: ${CHHATRI_SEED:-20251019}
      CHHATRI_CONSOLE_ORIGIN: ${CHHATRI_CONSOLE_ORIGIN:-http://localhost:5173}
      CHHATRI_PUBLIC_URL: ${CHHATRI_PUBLIC_URL:-http://backend:8000}
      CHHATRI_OFFICER_TOKEN: ${CHHATRI_OFFICER_TOKEN:-}
      CHHATRI_INTERNAL_SECRET: ${CHHATRI_INTERNAL_SECRET:-}
      CHHATRI_DEMO_MODE: ${CHHATRI_DEMO_MODE:-true}
      CHHATRI_LOG_LEVEL: ${CHHATRI_LOG_LEVEL:-INFO}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_DEMO_RECIPIENT: ${WHATSAPP_DEMO_RECIPIENT:-}
      PAYTM_MCP_URL: ${PAYTM_MCP_URL:-}
      PAYTM_MID: ${PAYTM_MID:-}
      PAYTM_KEY_SECRET: ${PAYTM_KEY_SECRET:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      COGNEE_ENABLED: ${COGNEE_ENABLED:-false}
      OPENMETEO_LIVE: ${OPENMETEO_LIVE:-false}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/data:/app/data:ro
      - ./backend/artifacts:/app/artifacts
      - backend-var:/app/var
    networks:
      - chhatri
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    networks:
      - chhatri
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional: n8n for live workflows (SPEC §14.5, §15)
  # Requires: N8N_BASE_URL environment variable to be set
  # Workflows auto-imported + activated on startup via entrypoint script
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.70.1
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: sqlite
      DB_SQLITE_PATH: /home/node/.n8n/database.sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-${CHHATRI_INTERNAL_SECRET}}
      N8N_WEBHOOK_URL: ${CHHATRI_PUBLIC_URL:-http://backend:8000}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"  # allow env access in expressions for CHHATRI_INTERNAL_SECRET
      WEBHOOK_URL: ${CHHATRI_PUBLIC_URL:-http://backend:8000}
      CHHATRI_PUBLIC_URL: ${CHHATRI_PUBLIC_URL:-http://backend:8000}
      CHHATRI_INTERNAL_SECRET: ${CHHATRI_INTERNAL_SECRET:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - chhatri
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - n8n  # disabled by default; enable with: docker compose --profile n8n up

  # Optional: Paytm payment MCP server (SPEC §14.3)
  # Requires: github.com/shivam3-garg/payment-mcp cloned locally
  # Usage: docker compose --profile paytm-mcp up
  # Then set PAYTM_MCP_URL=http://paytm-mcp:8080/sse in backend
  paytm-mcp:
    build:
      context: ./paytm-mcp  # assumes clone of payment-mcp repo
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - chhatri
    profiles:
      - paytm-mcp  # disabled by default; enable with: docker compose --profile paytm-mcp up
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  backend-var:
  n8n-data:

networks:
  chhatri:
    driver: bridge
