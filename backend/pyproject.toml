[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chhatri"
version = "0.1.0"
description = "Chhatri — merchant income cover where the claim starts itself (Build for India AI Hackathon, Track 2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "sse-starlette>=3.5,<4",
  "httpx>=0.28,<0.29",
  "python-multipart>=0.0.32",
  "numpy>=2.3,<3",
  "pandas>=3.0,<4",
  "lightgbm>=4.7,<5",
  "h3>=4.5,<5",
  "shapely>=2.1,<3",
  "networkx>=3.5,<4",
  "rapidfuzz>=3.14,<4",
  "pillow>=12,<13",
  "pyyaml>=6,<7",
  "sarvamai==0.1.34",
  "mcp==1.30.0",
  "paytmchecksum==1.7.0",
  "pycryptodome>=3.20,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.13",
]
memory = ["cognee>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["chhatri*"]

[tool.setuptools.package-data]
chhatri = ["policy/rules.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: trains real models or builds full-city data (deselect with -m 'not slow')",
  "live: needs real credentials; skipped when env keys are absent",
]

[tool.coverage.run]
source = ["chhatri"]
omit = ["chhatri/integrations/*_live_smoke.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
