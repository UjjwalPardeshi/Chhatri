# Chhatri CI (SPEC §22, §23; decisions B1, B7, B8). Mirrors `make lint`, `make test`, `make test-infra`
# and `make n8n-selftest`. Never builds artefacts (`make data` is a local, deliberate step).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + fast tests, coverage >= 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Fast tests with coverage
        env:
          COVERAGE_CORE: sysmon  # Python 3.12 low-overhead tracer, as in `make test-backend`
        run: python -m pytest -m "not slow" --cov=chhatri --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  infra:
    name: infra (n8n workflows, compose, Makefile, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e "backend[dev]"
      - name: Ruff (scripts; scripts/ruff.toml extends the backend config)
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: n8n workflows match chhatri.workflows.definitions.WORKFLOWS
        run: python scripts/n8n_workflows.py --check
      - name: Infra tests
        run: python -m pytest -p no:cacheprovider scripts/tests --cov=scripts --cov-report=term-missing --cov-fail-under=90
      - name: n8n self-test against the pinned n8n image
        run: python scripts/n8n_selftest.py --start-container
